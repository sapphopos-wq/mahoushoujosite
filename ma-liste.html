<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Ma liste — Magical Pyan !!!
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="list-page-body">


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            Magical Pyan !!!
        </a>


        <nav class="menu">

            <a
                href="index.html"
                class="menu-link"
            >
                Accueil
            </a>

            <a
                href="magical-girls.html"
                class="menu-link"
            >
                Magical Girls
            </a>

            <a
                href="romance.html"
                class="menu-link"
            >
                Romance
            </a>

        </nav>


        <div class="nav-actions">

            <a
    href="ma-liste.html"
    class="nav-button nav-button-link"
>
    ♡ Ma liste
</a>


<a
    href="mon-espace.html"
    class="nav-button nav-button-link"
>
    ♡ Mon espace
</a>


<button
    class="nav-button"
    id="search-button"
    type="button"
>
    ⌕ Rechercher
</button>

        </div>

    </header>



    <!-- =========================
         MOTEUR DE RECHERCHE
    ========================== -->

    <section
        class="search-panel"
        id="search-panel"
    >

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>


            <input
                type="search"
                id="search-input"
                placeholder="Rechercher un anime, un personnage, un genre..."
                autocomplete="off"
            >


            <button
                type="button"
                id="close-search"
                class="close-search"
                aria-label="Fermer la recherche"
            >
                ×
            </button>

        </div>


        <div
            class="search-results"
            id="search-results"
        ></div>

    </section>



    <!-- =========================
         MA LISTE
    ========================== -->

    <main class="my-list-page">

        <section class="my-list-section">


            <div class="my-list-heading">

                <p class="section-kicker">
                    ✧ Ta sélection
                </p>

                <h1>
                    Ma liste
                </h1>

            </div>



            <!-- =====================
                 LISTE VIDE
            ====================== -->

            <div
                class="my-list-empty"
                id="my-list-empty"
            >

                <p class="empty-message">
                    ✧ Ta liste est encore vide ✧
                </p>

                <p class="empty-description">
                    Ajoute un anime pour le retrouver ici !
                </p>

            </div>



            <!-- =====================
                 ANIME DE LA LISTE
            ====================== -->

            <div
                class="my-list-grid"
                id="my-list-grid"
            ></div>


        </section>

    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-logo">
            Magical Pyan !!!
        </div>

        <p>
            ✧ Un petit coin magique pour regarder des anime ✧
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
