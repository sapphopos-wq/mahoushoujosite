<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Lecture — Magical Pyan !!!
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <header class="navbar">

        <a
            href="index.html"
            class="logo"
        >
            Magical Pyan !!!
        </a>


        <nav class="menu">

            <a
                href="index.html"
                class="menu-link"
            >
                Accueil
            </a>

            <a
                href="magical-girls.html"
                class="menu-link"
            >
                Magical Girls
            </a>

            <a
                href="romance.html"
                class="menu-link"
            >
                Romance
            </a>

        </nav>


        <div class="nav-actions">

            <a
                href="ma-liste.html"
                class="nav-button nav-button-link"
            >
                ♡ Ma liste
            </a>


            <a
                href="mon-espace.html"
                class="nav-button nav-button-link"
            >
                ♡ Mon espace
            </a>


            <button
                class="nav-button"
                id="search-button"
                type="button"
            >
                ⌕ Rechercher
            </button>

        </div>

    </header>



    <!-- =========================
         MOTEUR DE RECHERCHE
    ========================== -->

    <section
        class="search-panel"
        id="search-panel"
    >

        <div class="search-box">

            <span class="search-icon">
                ⌕
            </span>


            <input
                type="search"
                id="search-input"
                placeholder="Rechercher un anime ou un titre alternatif..."
                autocomplete="off"
            >


            <button
                type="button"
                id="close-search"
                class="close-search"
                aria-label="Fermer la recherche"
            >
                ×
            </button>

        </div>


        <div
            class="search-results"
            id="search-results"
        ></div>

    </section>



    <!-- =========================
         LECTEUR
    ========================== -->

    <main class="player-page">


        <!-- =========================
             CONTRÔLES SUPÉRIEURS
        ========================== -->

        <section class="episode-controls">


            <div class="season-selector">

                <label for="season-select">
                    Saison :
                </label>

                <select
                    id="season-select"
                >
                </select>

            </div>


            <div class="episode-selector">

                <label for="episode-select">
                    épisode :
                </label>

                <select
                    id="episode-select"
                >
                </select>

            </div>

        </section>



        <!-- =========================
             NAVIGATION ÉPISODES
        ========================== -->

        <section class="episode-navigation">

            <button
                type="button"
                class="episode-nav-button"
                id="previous-episode"
            >
                ☆ Épisode précédent
            </button>


            <button
                type="button"
                class="episode-nav-button"
                id="next-episode"
            >
                Épisode suivant ☆
            </button>

        </section>



        <!-- =========================
             LECTEUR VIDÉO
        ========================== -->

        <section class="video-wrapper">

            <div class="video-decoration top-left">
                ✧
            </div>

            <div class="video-decoration top-right">
                ♡
            </div>

            <div class="video-decoration bottom-left">
                ♡
            </div>

            <div class="video-decoration bottom-right">
                ✧
            </div>



            <div
                class="custom-video-player"
                id="custom-video-player"
            >


                <!-- =====================
                     VIDÉO
                ====================== -->

                <video
                    id="video-player"
                    preload="metadata"
                    playsinline
                    webkit-playsinline
                >

                    <source
                        id="video-source"
                        src=""
                        type="video/mp4"
                    >

                    Ton navigateur ne peut pas lire cette vidéo.

                </video>

                <button
    type="button"
    id="video-center-play"
    class="video-center-play"
    aria-label="Lire la vidéo"
>
    ▶
</button>



                <!-- =====================
                     ZONES DOUBLE-CLIC MOBILE
                ====================== -->

                <div
                    class="video-seek-zone video-seek-zone-left"
                    id="video-seek-left"
                    aria-hidden="true"
                >
                </div>


                <div
                    class="video-seek-zone video-seek-zone-right"
                    id="video-seek-right"
                    aria-hidden="true"
                >
                </div>



                <!-- =====================
                     CONTRÔLES VIDÉO
                ====================== -->

                <div
                    class="video-controls"
                    id="video-controls"
                >


                    <!-- =================
                         BARRE DE PROGRESSION
                    ================== -->

                    <div class="video-progress-container">

                        <div
                            class="video-time-preview"
                            id="video-time-preview"
                        >
                            00:00
                        </div>


                        <input
                            type="range"
                            id="video-progress"
                            class="video-progress"
                            min="0"
                            max="100"
                            value="0"
                            step="0.1"
                            aria-label="Progression de la vidéo"
                        >

                    </div>



                    <!-- =================
                         LIGNE DES CONTRÔLES
                    ================== -->

                    <div class="video-controls-row">


                        <!-- =================
                             RETOUR 10 SECONDES
                        ================== -->

                        <button
                            type="button"
                            id="video-rewind"
                            class="video-control-button"
                            aria-label="Reculer de 10 secondes"
                        >
                            ↶ 10
                        </button>



                        <!-- =================
                             LECTURE / PAUSE
                        ================== -->

                        <button
                            type="button"
                            id="video-play"
                            class="video-control-button"
                            aria-label="Lire"
                        >
                            ▶
                        </button>



                        <!-- =================
                             AVANCE 10 SECONDES
                        ================== -->

                        <button
                            type="button"
                            id="video-forward"
                            class="video-control-button"
                            aria-label="Avancer de 10 secondes"
                        >
                            10 ↷
                        </button>



                        <!-- =================
                             TEMPS
                        ================== -->

                        <span
                            class="video-time"
                            id="video-time"
                        >
                            00:00 / 00:00
                        </span>



                        <div class="video-controls-spacer"></div>



                        <!-- =================
                             SON
                        ================== -->

                        <button
                            type="button"
                            id="video-mute"
                            class="video-control-button"
                            aria-label="Couper le son"
                        >
                            ♫
                        </button>


                        <input
                            type="range"
                            id="video-volume"
                            class="video-volume"
                            min="0"
                            max="1"
                            step="0.01"
                            value="1"
                            aria-label="Volume"
                        >



                        <!-- =================
                             PLEIN ÉCRAN
                        ================== -->

                        <button
                            type="button"
                            id="video-fullscreen"
                            class="video-control-button"
                            aria-label="Plein écran"
                        >
                            ⛶
                        </button>

                    </div>

                </div>

            </div>

        </section>



        <!-- =========================
             RETOUR
        ========================== -->

        <a
            href="pichi-pichi-pitch.html"
            class="back-to-anime"
        >
            ♡ Retour à Pichi Pichi Pitch
        </a>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <div class="footer-logo">
            Magical Pyan !!!
        </div>

        <p>
            ✧ Un petit coin magique pour regarder des anime ✧
        </p>

    </footer>



    <script src="script.js"></script>

</body>

</html>
